<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>کارت پستال تولد</title>

<style>
  body {
    direction: rtl;
    font-family: sans-serif;
    background: #fce4ec;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  /* کارت */
  .card {
    width: 400px;
    height: 560px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    overflow: hidden;
    transform-origin: left;
    animation: openCard 1.8s ease forwards;
    position: relative;
  }

  @keyframes openCard {
    0% { transform: scaleX(0); }
    100% { transform: scaleX(1); }
  }

  /* جلد کارت */
  .cover img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* داخل کارت */
  .inside {
    padding: 20px;
    text-align: center;
    background: linear-gradient(135deg, #fce4ec, #f8bbd0);
    animation: fadeIn 2.5s ease forwards;
    opacity: 0;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  .inside-photo img {
    width: 100%;
    border-radius: 12px;
    margin-bottom: 15px;
  }

  .title {
    font-size: 24px;
    color: #e91e63;
    font-weight: bold;
    margin-bottom: 10px;
  }

  .text {
    font-size: 15px;
    color: #444;
    line-height: 1.9;
    margin-bottom: 20px;
  }

  .footer {
    font-size: 13px;
    color: #880e4f;
    margin-top: 10px;
  }

  /* افکت درخشش */
  .sparkles {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    background-image: radial-gradient(circle, rgba(255,255,255,0.8) 2px, transparent 2px);
    background-size: 40px 40px;
    animation: sparkle 3s linear infinite;
  }

  @keyframes sparkle {
    from { background-position: 0 0; }
    to { background-position: 40px 40px; }
  }

  /* قلب‌های شناور */
  .heart {
    position: absolute;
    color: #ff80ab;
    font-size: 24px;
    animation: floatUp 6s linear infinite;
    opacity: 0.8;
  }

  @keyframes floatUp {
    0% { transform: translateY(50px); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateY(-300px); opacity: 0; }
  }

  /* پروانه‌های متحرک */
  .butterfly {
    position: absolute;
    width: 40px;
    animation: fly 8s linear infinite;
  }

  @keyframes fly {
    0% { transform: translateX(-50px) translateY(0); }
    50% { transform: translateX(200px) translateY(-80px); }
    100% { transform: translateX(-50px) translateY(0); }
  }
</style>
</head>

<body>

<!-- موزیک تولدی -->
<audio autoplay loop>
  <source src="https://files.catbox.moe/3m6j9p.mp3" type="audio/mpeg">
</audio>

<!-- قلب‌ها -->
<div class="heart" style="left:20px; animation-delay:0s;">💗</div>
<div class="heart" style="left:120px; animation-delay:1s;">💖</div>
<div class="heart" style="left:220px; animation-delay:2s;">💗</div>
<div class="heart" style="left:320px; animation-delay:3s;">💖</div>

<!-- پروانه‌ها -->
<img class="butterfly" src="https://i.ibb.co/4tYJQwq/butterfly.png" style="top:50px; left:10px;">
<img class="butterfly" src="https://i.ibb.co/4tYJQwq/butterfly.png" style="top:200px; left:300px; animation-delay:2s;">

<div class="card">
  <div class="sparkles"></div>

  <!-- جلد کارت -->
  <div class="cover">
    <img src="https://i.ibb.co/tMgR3s7c/IMG-20260830-WA0008.jpg" alt="Birthday Card Cover">
  </div>

  <!-- داخل کارت -->
  <div class="inside">
    <div class="inside-photo">
      <img src="https://i.ibb.co/PZdPWybB/IMG-20260830-WA0007.jpg" alt="Inside Photo">
    </div>

    <div class="title">تولدمه 😍❤️</div>

    <div class="text">
      تولد یک دلیل خوب برای دورهمی است<br>
      تا بتوانم این جشن را با افراد خاص زندگی‌ام جشن بگیرم 💖
      <br><br>
      <b>زمان:</b> پنجشنبه ۱۲ شهریور – ساعت ۹:۰۰<br>
      <b>مکان:</b> خونه حسین صابری
    </div>

    <div class="footer">فرستنده: محلا صابری</div>
  </div>
</div>

</body>
</html>
