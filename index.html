<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>کارت پستال مجازی</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;

    background:
        radial-gradient(circle at top, #4b1d5f, transparent 45%),
        linear-gradient(135deg, #08000f, #1c0025, #050008);

    font-family: Tahoma, Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;

    overflow-x: hidden;
}

/* ستاره‌ها */

.stars {
    position: fixed;
    inset: 0;

    pointer-events: none;
}

.star {
    position: absolute;

    width: 3px;
    height: 3px;

    background: white;

    border-radius: 50%;

    opacity: .7;
}


/* کارت */

.card {

    width: 100%;
    max-width: 420px;

    background:
        linear-gradient(
            145deg,
            #fffaf0,
            #f3dfb5
        );

    color: #351326;

    border-radius: 22px;

    padding: 35px 25px;

    text-align: center;

    box-shadow:
        0 20px 60px rgba(0,0,0,.55);

    border: 2px solid rgba(255,216,107,.5);

    position: relative;

    z-index: 2;
}


/* قلب */

.big-heart {

    font-size: 65px;

    margin-bottom: 15px;

}


/* عنوان */

.card-title {

    font-size: 30px;

    color: #8c2148;

    margin-bottom: 15px;

}


/* خط */

.line {

    width: 70%;

    height: 2px;

    margin: 25px auto;

    background: #c99327;

}


/* متن */

.card-text {

    font-size: 17px;

    line-height: 2;

    color: #40202d;

}


/* امضا */

.signature {

    font-size: 17px;

    font-weight: bold;

    color: #8c2148;

    margin-top: 20px;

}


/* پایین کارت */

.footer {

    margin-top: 25px;

    font-size: 13px;

    color: #76545f;

}


/* دکمه */

button {

    margin-top: 25px;

    border: none;

    padding: 12px 25px;

    border-radius: 30px;

    background:
        linear-gradient(
            135deg,
            #ffd86b,
            #c99327
        );

    color: #2b1600;

    font-weight: bold;

    font-size: 15px;

    cursor: pointer;

}


/* قلب‌های شناور */

.floating-heart {

    position: fixed;

    bottom: -30px;

    font-size: 20px;

    animation: floatUp 5s linear forwards;

    pointer-events: none;

    z-index: 10;
}


@keyframes floatUp {

    0% {

        transform: translateY(0);

        opacity: 0;

    }

    15% {

        opacity: 1;

    }

    100% {

        transform: translateY(-110vh);

        opacity: 0;

    }

}


@media(max-width:450px) {

    .card {

        padding: 30px 20px;

    }

    .card-title {

        font-size: 26px;

    }

    .card-text {

        font-size: 16px;

    }

}

</style>

</head>


<body>


<div class="stars" id="stars"></div>


<div class="card">


    <!-- ================================================= -->
    <!--        ✏️ متن‌های قابل تغییر کارت                -->
    <!-- ================================================= -->


    <!-- قلب بالای کارت -->

    <div class="big-heart">
        ❤️
    </div>


    <!-- عنوان -->

    <h1 class="card-title">
        برای تو
    </h1>


    <div class="line"></div>


    <!-- متن اصلی -->

    <p class="card-text">

        بعضی حرف‌ها را نمی‌شود
        با چند کلمه ساده گفت... 🌹

        <br><br>

        برای همین این کارت را ساختم
        تا یک لبخند کوچک روی صورتت بیاورد. ✨

        <br><br>

        امیدوارم همیشه
        دلت پر از آرامش و شادی باشد. ❤️

    </p>


    <div class="line"></div>


    <!-- امضا -->

    <div class="signature">

        با بهترین آرزوها 🌹

    </div>


    <!-- متن پایین کارت -->

    <div class="footer">

        یک کارت کوچک، برای یک آدم خاص ✨

    </div>


    <!-- متن دکمه -->

    <button onclick="newHearts()">

        ❤️ ارسال قلب

    </button>


</div>


<script>


/* ================================================= */
/*                 ستاره‌ها                          */
/* ================================================= */


const stars =
    document.getElementById("stars");


for(let i = 0; i < 80; i++){

    const star =
        document.createElement("div");

    star.className = "star";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    stars.appendChild(star);

}


/* ================================================= */
/*                 افکت قلب                          */
/* ================================================= */


function newHearts(){

    for(let i = 0; i < 20; i++){

        const heart =
            document.createElement("div");

        heart.className =
            "floating-heart";

        heart.innerHTML =
            Math.random() > .5
            ? "❤️"
            : "✨";

        heart.style.left =
            Math.random() * 100 + "vw";

        heart.style.animationDuration =
            (3 + Math.random() * 3) + "s";

        document.body.appendChild(heart);


        setTimeout(() => {

            heart.remove();

        }, 6000);

    }

}

</script>


</body>

</html>
