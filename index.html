<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>کارت تولد</title>
<style>
  body {direction: rtl; font-family: sans-serif; background: #fce4ec; display:flex; justify-content:center; align-items:center; min-height:100vh;}
  .card {background:#fff; width:380px; padding:20px; border-radius:16px; box-shadow:0 8px 20px rgba(0,0,0,0.15); border:3px solid #f8bbd0;}
  .title {text-align:center; color:#e91e63; font-size:22px; font-weight:bold; margin-bottom:10px;}
  .text {color:#444; font-size:14px; line-height:1.8; text-align:center;}
  .footer {margin-top:18px; text-align:center; font-size:12px; color:#999;}
</style>
</head>
<body>

<div class="card">

  <div class="title">تولدمه 😍❤️</div>

  <div class="text">
    تولد یک دلیل خوب برای دورهمی است<br>
    تا بتوانم این جشن را با افراد خاص زندگی‌ام جشن بگیرم 💖
    <br><br>
    <b>زمان:</b> پنجشنبه ۱۲ شهریور – ساعت ۹:۰۰<br>
    <b>مکان:</b> خونه حسین صابری
  </div>

  <div class="footer">فرستنده: محلا صابری</div>

</div>

</body>
</html>
