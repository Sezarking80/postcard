<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>کارت پستال کتابی</title>

<style>
  body {
    direction: rtl;
    font-family: sans-serif;
    background: #fce4ec;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    perspective: 1500px;
  }

  .book {
    width: 450px;
    height: 600px;
    position: relative;
    transform-style: preserve-3d;
  }

  /* جلد کارت */
  .cover {
    width: 100%;
    height: 100%;
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: left;
    animation: openCover 2s ease forwards;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
  }

  @keyframes openCover {
    0% { transform: rotateY(0deg); }
    100% { transform: rotateY(-140deg); }
  }

  .cover img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* صفحه داخل */
  .inside {
    width: 100%;
    height: 100%;
    background: #fff;
    border-radius: 12px;
    overflow-y: auto;
    padding: 20px;
    position: absolute;
    top: 0;
    left: 0;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    animation: showInside 2.2s ease forwards;
    opacity: 0;
  }

  @keyframes showInside {
    to { opacity: 1; }
  }

  .inside-photo img {
    width: 100%;
    border-radius: 12px;
    margin-bottom: 15px;
  }

  .title {
    font-size: 26px;
    color: #e91e63;
    font-weight: bold;
    margin-bottom: 10px;
    text-align: center;
  }

  .text {
    font-size: 16px;
    color: #444;
    line-height: 1.9;
    text-align: center;
    margin-bottom: 20px;
  }

  .footer {
    font-size: 14px;
    color: #880e4f;
    text-align: center;
    margin-top: 10px;
  }
</style>
</head>

<body>

<div class="book">

  <!-- جلد کارت -->
  <div class="cover">
    <img src="https://i.ibb.co/tMgR3s7c/IMG-20260830-WA0008.jpg">
  </div>

  <!-- صفحه اول داخل کارت -->
  <div class="inside">
    <div class="inside-photo">
      <img src="https://i.ibb.co/PZdPWybB/IMG-20260830-WA0007.jpg">
    </div>

    <div class="title">تولدمه 😍❤️</div>

    <div class="text">
      تولد یک دلیل خوب برای دورهمی است<br>
      تا بتوانم این جشن را با افراد خاص زندگی‌ام جشن بگیرم 💖
      <br><br>
      <b>زمان:</b> پنجشنبه ۱۲ شهریور – ساعت ۹:۰۰<br>
      <b>مکان:</b> خونه حسین صابری
    </div>

    <div class="footer">فرستنده: محلا صابری</div>
  </div>

</div>

</body>
</html>
