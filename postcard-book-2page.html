<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>کارت پستال کتابی دو صفحه‌ای</title>

<style>
  body {
    direction: rtl;
    font-family: sans-serif;
    background: #fce4ec;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    perspective: 1500px;
    overflow: hidden;
  }

  .book {
    width: 700px;
    height: 500px;
    position: relative;
    transform-style: preserve-3d;
  }

  /* جلد کارت */
  .cover {
    width: 100%;
    height: 100%;
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: left;
    animation: openCover 2s ease forwards;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    z-index: 10;
  }

  @keyframes openCover {
    0% { transform: rotateY(0deg); }
    100% { transform: rotateY(-140deg); }
  }

  .cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* دو صفحه داخل کتاب */
  .pages {
    width: 100%;
    height: 100%;
    background: #fff;
    border-radius: 12px;
    display: flex;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    opacity: 0;
    animation: showPages 2.4s ease forwards;
  }

  @keyframes showPages {
    to { opacity: 1; }
  }

  .left-page, .right-page {
    width: 50%;
    padding: 20px;
  }

  .left-page img {
    width: 100%;
    border-radius: 12px;
  }

  .title {
    font-size: 26px;
    color: #e91e63;
    font-weight: bold;
    margin-bottom: 10px;
    text-align: center;
  }

  .text {
    font-size: 16px;
    color: #444;
    line-height: 1.9;
    text-align: center;
    margin-bottom: 20px;
  }

  .footer {
    font-size: 14px;
    color: #880e4f;
    text-align: center;
    margin-top: 10px;
  }

  /* قلب‌های شناور */
  .heart {
    position: absolute;
    color: #ff80ab;
    font-size: 26px;
    animation: floatUp 6s linear infinite;
    opacity: 0.8;
    z-index: 999;
  }

  @keyframes floatUp {
    0% { transform: translateY(50px); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateY(-300px); opacity: 0; }
  }
</style>
</head>

<body>

<!-- موزیک تولدی -->
<audio autoplay loop>
  <source src="https://files.catbox.moe/3m6j9p.mp3" type="audio/mpeg">
</audio>

<!-- قلب‌ها -->
<div class="heart" style="left:80px; animation-delay:0s;">💗</div>
<div class="heart" style="left:180px; animation-delay:1s;">💖</div>
<div class="heart" style="left:280px; animation-delay:2s;">💗</div>
<div class="heart" style="left:380px; animation-delay:3s;">💖</div>
<div class="heart" style="left:480px; animation-delay:4s;">💗</div>

<div class="book">

  <!-- جلد کارت انتخابی -->
  <div class="cover">
    <img src="https://i.ibb.co/8m0t8mZ/birthday-cover.jpg">
  </div>

  <!-- دو صفحه داخل کارت -->
  <div class="pages">

    <!-- صفحه سمت چپ: عکس دوم -->
    <div class="left-page">
      <img src="https://i.ibb.co/PZdPWybB/IMG-20260830-WA0007.jpg">
    </div>

    <!-- صفحه سمت راست: متن‌ها -->
    <div class="right-page">
      <div class="title">تولدمه 😍❤️</div>

      <div class="text">
        تولد یک دلیل خوب برای دورهمی است<br>
        تا بتوانم این جشن را با افراد خاص زندگی‌ام جشن بگیرم 💖
        <br><br>
        <b>زمان:</b> پنجشنبه ۱۲ شهریور – ساعت ۹:۰۰<br>
        <b>مکان:</b> خونه حسین صابری
      </div>

      <div class="footer">فرستنده: محلا صابری</div>
    </div>

  </div>

</div>

</body>
</html>
